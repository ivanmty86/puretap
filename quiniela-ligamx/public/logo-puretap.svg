<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="100%" height="100%" fill="none">
  <!-- Tap Icon and Amber Drop Group on Left -->
  <g transform="translate(10, 10)">
    <!-- Base / Tower Mount -->
    <rect x="0" y="52" width="14" height="28" rx="2" fill="#0A2540" />
    <!-- Horizontal Pipe / Shank -->
    <path d="M14 58 L32 58 Q36 58 36 62 L36 68 Q36 72 32 72 L14 72 Z" fill="#1B3A5F" />
    <rect x="28" y="55" width="6" height="20" rx="1.5" fill="#0A2540" />
    
    <!-- Faucet Body -->
    <path d="M36 60 L48 60 Q52 60 54 64 L56 74 Q56 80 52 82 L42 82 Q38 80 38 74 L36 60 Z" fill="#0A2540" />
    <!-- Spout (Nozzle) -->
    <path d="M46 76 L48 90 Q48.5 93 45.5 93 L43.5 93 Q40.5 93 41 90 L43 76 Z" fill="#1B3A5F" />
    <circle cx="44.5" cy="91" r="2.2" fill="#0A2540" />

    <!-- Tap Handle Collar -->
    <rect x="39" y="47" width="10" height="9" rx="1.5" fill="#0A2540" />
    <rect x="42" y="52" width="4" height="6" fill="#D4A017" />
    <!-- Tap Lever / Handle -->
    <path d="M41 47 L42 16 Q42 12 44 12 Q46 12 46 16 L47 47 Z" fill="#0A2540" />
    <!-- Handle Top Finial -->
    <ellipse cx="44" cy="12" rx="4.5" ry="5.5" fill="#1B3A5F" />
    
    <!-- Amber / Gold Droplet falling from spout -->
    <g transform="translate(37, 95)">
      <!-- Main Drop Shape -->
      <path d="M7.5 0 C7.5 0 0 9 0 14.5 C0 18.6 3.4 22 7.5 22 C11.6 22 15 18.6 15 14.5 C15 9 7.5 0 7.5 0 Z" fill="url(#amberGrad)" />
      <!-- Golden Glow / Highlight -->
      <path d="M5.5 8 C5.5 8 2.5 12.5 2.5 15 C2.5 16.5 3.3 18 4.5 18.5" stroke="#FFF" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.85" />
      <!-- Inner White Swirl -->
      <path d="M7 17.5 C5.2 17.5 4.4 16 4.7 14.7 C5 13.2 6.8 12.8 8.2 13.8 C9.4 14.6 9.8 16.2 8.5 17.1 C7.8 17.6 7.3 17.5 7 17.5 Z" fill="#FFFFFF" opacity="0.95" />
      <circle cx="7.2" cy="14.8" r="0.9" fill="#D4A017" />
    </g>
  </g>

  <!-- Typography Group on Right -->
  <g transform="translate(86, 0)">
    <!-- Subtitle Top: MONTERREY, NL -->
    <text x="0" y="32" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="3.5" fill="#1B3A5F">
      MONTERREY, NL
    </text>

    <!-- Main Title: PURETAP -->
    <text x="0" y="68" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="1.2" fill="#0A2540">
      PURE<tspan fill="#D4A017">TAP</tspan>
    </text>

    <!-- Underline accent bar -->
    <rect x="0" y="74" width="230" height="2" fill="#D4A017" opacity="0.85" rx="1" />

    <!-- Subtitle Bottom: LIMPIEZA Y EQUIPO CERVECERO -->
    <text x="0" y="91" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.2" font-weight="700" letter-spacing="2.8" fill="#1B3A5F">
      LIMPIEZA Y EQUIPO CERVECERO
    </text>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8B923" />
      <stop offset="50%" stop-color="#D4A017" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
  </defs>
</svg>
